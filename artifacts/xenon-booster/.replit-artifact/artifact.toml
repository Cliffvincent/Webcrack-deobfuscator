kind = "web"
previewPath = "/"
title = "Xenon Booster"
description = "A Node.js social growth control panel for browsing services, placing orders, tracking status, and managing refills through a protected provider proxy."
version = "1.0.0"
id = "artifacts/xenon-booster"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19814

[services.development]
run = "pnpm --filter @workspace/xenon-booster run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/xenon-booster", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "artifacts/xenon-booster/server.js" ]

[services.production.run.env]
PORT = "19814"
NODE_ENV = "production"

[services.production.health.startup]
path = "/booster-api/health"
